name: Cloudflare Sync

on:
  push:
    branches: [main]
    paths:
      - 'deploy/cloudflare/**'
  workflow_dispatch:

concurrency:
  group: cloudflare-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Cloudflare DNS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PyYAML
        run: pip install --user pyyaml

      - name: Sync Cloudflare DNS
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python3 deploy/cloudflare/sync.py
