name: Deploy FIF

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild (frontend + all services)'
        required: false
        default: false
        type: boolean

concurrency:
  group: fif-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS SumoPod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            ARGS=""
            if [ "${{ inputs.force == true }}" = "true" ]; then
              ARGS="--force"
            fi
            sudo bash /var/www/fif/deploy/deploy-vps.sh $ARGS
