name: Temp Add SSH Key

on:
  workflow_dispatch:

jobs:
  add-key:
    runs-on: ubuntu-latest
    steps:
      - name: Add local pubkey to fif authorized_keys
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            touch ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
            grep -qF 'addinyas@gmail.com' ~/.ssh/authorized_keys || \
              echo 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICSmhd9p+TrNx8g+qRIzfXR8PnDvKbzPHk8FUdUdE8p3 addinyas@gmail.com' >> ~/.ssh/authorized_keys
            echo '=== authorized_keys ==='
            cat ~/.ssh/authorized_keys
