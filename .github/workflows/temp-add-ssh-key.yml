name: Temp Add SSH Key

on:
  workflow_dispatch:

jobs:
  add-key:
    runs-on: ubuntu-latest
    steps:
      - name: Add local pubkey to fif authorized_keys
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            whoami
            sudo mkdir -p /home/fif/.ssh && sudo chmod 700 /home/fif/.ssh
            sudo touch /home/fif/.ssh/authorized_keys && sudo chmod 600 /home/fif/.ssh/authorized_keys
            sudo grep -qF 'addinyas@gmail.com' /home/fif/.ssh/authorized_keys || \
              echo 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICSmhd9p+TrNx8g+qRIzfXR8PnDvKbzPHk8FUdUdE8p3 addinyas@gmail.com' | sudo tee -a /home/fif/.ssh/authorized_keys >/dev/null
            sudo chown -R fif:fif /home/fif/.ssh
            echo '=== fif authorized_keys ==='
            sudo cat /home/fif/.ssh/authorized_keys
