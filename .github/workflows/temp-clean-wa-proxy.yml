name: Temp Clean WA_PROXY env

on:
  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Remove WA_PROXY line from worker .env
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            sudo sed -i '/^WA_PROXY=/d' /var/www/fif/worker/.env
            echo '=== remaining WA_PROXY refs in worker/.env ==='
            sudo grep -c WA_PROXY /var/www/fif/worker/.env || echo '0 (bersih)'
            echo '=== worker .env content ==='
            sudo cat /var/www/fif/worker/.env
