name: Temp SSH Diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose sshd acceptance for fif
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            echo "=== HOME ==="
            getent passwd fif
            echo "=== home perms ==="
            ls -ld /home/fif
            echo "=== .ssh perms ==="
            ls -la /home/fif/.ssh/
            echo "=== authorized_keys content ==="
            cat /home/fif/.ssh/authorized_keys
            echo "=== sshd config AuthorizedKeysFile/StrictModes ==="
            sudo grep -iE "AuthorizedKeysFile|StrictModes" /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf 2>/dev/null || true
            echo "=== fif default shell ==="
            getent passwd fif | cut -d: -f7
