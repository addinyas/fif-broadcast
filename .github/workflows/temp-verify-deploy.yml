name: Temp Verify Deploy

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify post-deploy state
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd /var/www/fif
            echo "=== git HEAD ==="
            sudo git rev-parse --short HEAD
            echo "=== wa_proxy migration status ==="
            cd /var/www/fif/backend
            sudo -u fif php artisan migrate:status 2>&1 | grep -iE "wa_proxy|Pending|Ran" | head -40
            echo "=== wa_proxy column in users ==="
            sudo -u fif php artisan tinker --execute="echo \Illuminate\Support\Facades\Schema::hasColumn('users','wa_proxy') ? 'COLUMN_EXISTS' : 'COLUMN_GONE';" 2>&1 | tail -2
            echo "=== auth_info dir ==="
            sudo ls -la /var/www/fif/worker/auth_info 2>&1 | head -10 || echo "auth_info EMPTY/MISSING"
            echo "=== worker env WA_PROXY ==="
            sudo grep -c WA_PROXY /var/www/fif/worker/.env 2>/dev/null || echo "0"
